syntax = "proto3";

option go_package = "github.com/fluffy-bunny/fluffycore-rage-identity/proto/oidc/idp;idp";
option java_multiple_files = true;
option java_package = "com.fluffybunny.rageoidc.idp";
option csharp_namespace = "FluffyBunny.RageOidc.Oidc.IDP";


package proto.oidc.idp;

import "google/protobuf/descriptor.proto";
import "proto/types/filter.proto";
import "proto/oidc/models/idp.proto";

message Filter {
    proto.types.StringFilterExpression              slug = 1;
    proto.types.BoolFilterExpression                enabled = 2;
    proto.types.StringArrayFilterExpression         claimed_domains =  3;
    proto.types.BoolFilterExpression                hidden = 4;
}

// SingletonIDPService ...
service SingletonIDPService {
   
    // List idps
    rpc ListIDP (ListIDPRequest) returns (ListIDPResponse) {}
 } 

 
message ListIDPRequest {
   // Filter
   Filter filter = 1;

}

message ListIDPResponse {
   repeated proto.oidc.models.IDP i_d_ps = 1;
}

// ExampleIDPStore is a full worked example of a richer IDP store
// backed by a real database — this project backs it with an embedded,
// pure-Go SQLite store (see pkg/services/idp/sqlite). SingletonIDPService
// above is intentionally minimal (ListIDP-only): that's the one contract
// every consumer of this library must implement, however they choose to
// persist IDPs. This service is not that contract — it's a worked example
// of what a consumer could build on the same IDP message shape if they want
// full CRUD, using our own sqlite-backed implementation as the reference.
service ExampleIDPStore {
    // List idps
    rpc ListIDP (ListIDPRequest) returns (ListIDPResponse) {}
    // Create a new idp
    rpc CreateIDP (CreateIDPRequest) returns (CreateIDPResponse) {}
    // Update an existing idp
    rpc UpdateIDP (UpdateIDPRequest) returns (UpdateIDPResponse) {}
    // Delete an idp
    rpc DeleteIDP (DeleteIDPRequest) returns (DeleteIDPResponse) {}
}

message CreateIDPRequest {
    proto.oidc.models.IDP idp = 1;
}
message CreateIDPResponse {
    proto.oidc.models.IDP idp = 1;
}
message UpdateIDPRequest {
    // slug identifies which idp to update. idp.slug, if set, must match —
    // renaming a slug via update is not supported.
    string slug = 1;
    proto.oidc.models.IDP idp = 2;
}
message UpdateIDPResponse {
    proto.oidc.models.IDP idp = 1;
}
message DeleteIDPRequest {
    string slug = 1;
}
message DeleteIDPResponse {}
